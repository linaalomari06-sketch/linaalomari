<style>
/* Layout: floating glass dock over an editorial one-pager — hero with orbiting portrait, stats, about, tabbed work (bento + case-study overlays), journey timeline, contact */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --sunk:#ECEFF5; --ink:#0E1A32; --muted:#5A6479; --line:#DADFE8;
  --navy:#1B2E5A; --navy-ink:#FFFFFF; --gold:#A8874A; --gold-soft:#E9DFC9;
  --cover:#13244A; --cover-line:#C9A962;
  --ok:#2C6B4F; --warn:#9A6414; --danger:#A3302A;
  --glass:rgba(255,255,255,.72); --shadow:0 18px 50px -24px rgba(14,26,50,.35);
  --s1:#2F55C8; --s2:#B9821A; --s3:#B8417F;
  --f-display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-body:"Jost","Avenir Next","Century Gothic",system-ui,sans-serif;
  --r:6px; --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09101E; --surface:#0F182B; --sunk:#152139; --ink:#E8ECF4; --muted:#9AA6BC; --line:#22304D;
  --navy:#B7C6EC; --navy-ink:#09101E; --gold:#D3B77B; --gold-soft:#3A3222;
  --cover:#0F1D3B; --cover-line:#D3B77B;
  --ok:#7CCBA5; --warn:#E5B36A; --danger:#F09A93;
  --glass:rgba(15,24,43,.72); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --s1:#5A82E6; --s2:#BF8820; --s3:#DB5590; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09101E; --surface:#0F182B; --sunk:#152139; --ink:#E8ECF4; --muted:#9AA6BC; --line:#22304D;
  --navy:#B7C6EC; --navy-ink:#09101E; --gold:#D3B77B; --gold-soft:#3A3222;
  --cover:#0F1D3B; --cover-line:#D3B77B;
  --ok:#7CCBA5; --warn:#E5B36A; --danger:#F09A93;
  --glass:rgba(15,24,43,.72); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --s1:#5A82E6; --s2:#BF8820; --s3:#DB5590; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
body.locked{overflow:hidden}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.rule{display:flex;align-items:center;gap:14px}
.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.serif{font-family:var(--f-display)}
kbd{font-family:var(--f-body);font-size:11px;font-weight:500;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--surface);color:var(--muted)}
.sec{padding-block:96px 0}
.sec-title{font-family:var(--f-display);font-size:clamp(40px,5.5vw,64px);line-height:1;margin:14px 0 18px}
.sec-title em{color:var(--gold);font-style:italic}
.sec-lead{color:var(--muted);font-weight:300;font-size:18px;max-width:56ch}

/* progress + dock */
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:2px;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:36}
.dock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock .mono{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:20px;color:var(--navy);text-decoration:none;padding:2px 12px 2px 10px}
.dock a.nav{position:relative;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.06em;padding:8px 13px;border-radius:999px;white-space:nowrap;transition:color .2s}
.dock a.nav:hover{color:var(--ink)}
.dock a.nav.on{color:var(--navy-ink);background:var(--navy)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;border:0;background:transparent;color:var(--ink);flex:none;transition:background .2s}
.iconbtn:hover{background:var(--sunk)}
.cmdk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;color:var(--muted);font-size:13px;white-space:nowrap}
.cmdk:hover{border-color:var(--gold);color:var(--ink)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.04em;white-space:nowrap;text-decoration:none;overflow:hidden;transition:border-color .25s,transform .25s var(--ease)}
.btn:hover{border-color:var(--navy)}
.btn:active{transform:scale(.97)}
.btn .i{transition:transform .35s var(--ease)}
.btn:hover .i.go{transform:translateX(4px)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn.primary:hover::before{transform:translateX(120%)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16110A}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:12px;gap:6px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;padding-block:150px 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px circle at var(--mx,70%) var(--my,30%),color-mix(in srgb,var(--gold) 14%,transparent),transparent 60%);pointer-events:none;transition:background .2s}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:center}
.avail{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;color:var(--ink)}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.name{font-family:var(--f-display);font-size:clamp(60px,9.5vw,124px);line-height:.9;letter-spacing:-.015em;margin:26px 0 22px}
.name span{display:block;animation:rise 1s var(--ease) both}
.name span+span{animation-delay:.12s;font-style:italic;color:var(--navy)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.rotator{font-size:clamp(18px,2.3vw,22px);font-weight:300;color:var(--muted);margin-bottom:12px;min-height:1.6em}
.rotator b{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.3em;color:var(--gold);display:inline-block;transition:opacity .35s,transform .35s var(--ease)}
.rotator b.out{opacity:0;transform:translateY(-8px)}
.name .ch{display:inline-block;animation:rise .9s var(--ease) both}
.flower{width:18px;height:18px;color:var(--gold);flex:none;overflow:visible}
.flower .pt{transform-box:view-box;transform-origin:24px 24px}
.flower.bloom .pt{animation:petal .9s var(--ease) both}
.flower.spin{animation:spin 24s linear infinite}
@keyframes petal{from{transform:scale(0) rotate(-40deg);opacity:0}}
.sunfield{position:absolute;inset:-6%;width:112%;height:112%;z-index:0;pointer-events:none}
.portrait .ring,.portrait .arch{z-index:1}
.label.rule .flower{width:16px;height:16px}
.label.rule{gap:10px}
.marquee{overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg);padding-block:18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee .track{display:flex;gap:28px;width:max-content;animation:slide 48s linear infinite;align-items:center}
.marquee:hover .track{animation-play-state:paused}
.marquee span{font-family:var(--f-display);font-style:italic;font-size:26px;white-space:nowrap;color:var(--ink)}
@keyframes slide{to{transform:translateX(-50%)}}
.edu{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:26px;position:relative;overflow:hidden}
.edu h3{font-family:var(--f-display);font-size:30px;line-height:1.15;margin:10px 0 6px}
.edu p{color:var(--muted);font-weight:300}
.edu .flower{position:absolute;right:-30px;bottom:-30px;width:150px;height:150px;opacity:.18}
.petal-fx{position:fixed;z-index:80;width:10px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--gold);pointer-events:none}
.contact .bgflower{position:absolute;right:-180px;top:-220px;width:760px;height:760px;opacity:.55;pointer-events:none;animation:spin 120s linear infinite}
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion:no-preference){
    .reveal{animation:revealup linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
  }
}
@keyframes revealup{from{opacity:0;transform:translateY(36px)}}
.headline{font-weight:300;font-size:18px;max-width:52ch;color:var(--ink);opacity:.85;margin-bottom:30px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hint{margin-top:26px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.portrait{position:relative;width:100%;max-width:380px;aspect-ratio:1;justify-self:end;display:grid;place-items:center}
.portrait .ring{position:absolute;inset:0;animation:spin 40s linear infinite}
.portrait .ring text{font-family:var(--f-body);font-size:10.5px;letter-spacing:.42em;fill:var(--muted);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
.portrait .arch{position:relative;width:62%;aspect-ratio:3/4;border-radius:999px 999px 10px 10px;overflow:hidden;background:var(--cover);display:grid;place-items:center;box-shadow:var(--shadow)}
.portrait .arch img{width:100%;height:100%;object-fit:cover}
.portrait .arch b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:88px;color:#F3EBDD}
.portrait .arch::after{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--cover-line) 55%,transparent);border-radius:999px 999px 6px 6px;pointer-events:none}
.portrait .flower.a{position:absolute;z-index:2;top:11%;right:12%;width:34px;height:34px}
.portrait .flower.b{position:absolute;z-index:2;bottom:13%;left:10%;width:22px;height:22px}

/* stats */
.stats{border-block:1px solid var(--line);background:var(--surface);margin-top:72px}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:26px 8px 24px 0;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line);padding-left:24px}
.stat:first-child{padding-left:0}.stat:last-child{border-right:0}
.stat strong{font-family:var(--f-display);font-size:54px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stat:hover strong{color:var(--gold)}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;margin-top:36px}
.about-text{font-weight:300;font-size:18px;white-space:pre-line;color:var(--ink);opacity:.88}
.values{display:flex;flex-direction:column}
.value{border-top:1px solid var(--line)}
.value:last-child{border-bottom:1px solid var(--line)}
.value button{all:unset;cursor:pointer;display:flex;align-items:center;gap:16px;width:100%;padding:20px 0;box-sizing:border-box}
.value button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.value .n{font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:18px;width:28px}
.value h3{font-family:var(--f-display);font-size:30px;flex:1}
.value .plus{transition:transform .35s var(--ease);color:var(--muted)}
.value[data-open="true"] .plus{transform:rotate(45deg)}
.value .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.value[data-open="true"] .ans{grid-template-rows:1fr}
.value .ans>div{overflow:hidden}
.value .ans p{padding:0 0 22px 44px;color:var(--muted);font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;font-size:14px;transition:border-color .2s,transform .2s var(--ease)}
.chips li:hover{border-color:var(--gold);transform:translateY(-2px)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:56px}
.duo h4{font-family:var(--f-display);font-size:26px;margin:10px 0 16px}

/* work */
.work-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.tabs{position:relative;display:flex;gap:4px;padding:5px;background:var(--sunk);border-radius:999px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;border:0;background:none;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:baseline;transition:color .25s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy-ink)}
.tab sup{font-size:10px;opacity:.75}
.tab-ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;background:var(--navy);border-radius:999px;transition:transform .45s var(--ease),width .45s var(--ease)}
.tools{display:flex;gap:10px;align-items:center;margin:28px 0 30px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-width:0;flex:0 1 300px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:14px;color:var(--ink);padding:10px 0;width:100%;min-width:0}
.search:focus-within{border-color:var(--gold)}
.filter{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);transition:all .2s}
.filter:hover{color:var(--ink);border-color:var(--ink)}
.filter[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.noresult{padding:48px 0;color:var(--muted);text-align:center}

.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s;transform-style:preserve-3d;min-width:0;animation:fadeup .6s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.bento{grid-auto-flow:dense}
.card.wide{grid-column:span 2}
.card.wide .cover{aspect-ratio:21/9}
.card.full{grid-column:1/-1;flex-direction:row}
.card.full .cover{width:46%;aspect-ratio:auto;min-height:260px;flex:none}
.card.feature{grid-column:span 2;grid-row:span 2}
.card .cover{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--cover)}
.card.feature .cover{aspect-ratio:auto;flex:1;min-height:280px}
.card.feature .body{flex:none}
.card .cover>img,.card .cover>svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.card:hover .cover>img,.card:hover .cover>svg{transform:scale(1.05)}
.card .badge{position:absolute;top:12px;left:12px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.card .count{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;align-items:center;background:var(--glass);backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink)}
.card .body{padding:22px 22px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.card h3{font-family:var(--f-display);font-size:28px;line-height:1.1}
.card.feature h3{font-size:36px}
.card p.sum{color:var(--muted);font-weight:300;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.card .more{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--navy)}
.card .more .i{transition:transform .35s var(--ease)}
.card:hover .more .i{transform:translateX(5px)}
.pill{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.pill.done{color:var(--ok)}.pill.progress{color:var(--warn)}.pill.planned{color:var(--gold)}
.mini-tags{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.edit-row{display:flex;gap:6px}

.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.certs .card .cover{aspect-ratio:4/3;background:var(--sunk);padding:14px}
.certs .card .cover>img{border-radius:4px;object-fit:cover}
.rowi .thumb{width:104px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);display:block;transition:transform .45s var(--ease)}
.rowi .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rowi:hover .thumb{transform:rotate(-3deg) scale(1.06)}
.certs .card .cover>img.doc{object-fit:contain;filter:drop-shadow(0 6px 14px rgba(6,12,26,.16))}
.cert-frame{all:unset;box-sizing:border-box;display:block;width:100%;padding:18px;background:var(--sunk);border-radius:14px;cursor:zoom-in}
.cert-frame+.cert-frame{margin-top:14px}
.cert-frame img{display:block;width:100%;max-height:70vh;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(6,12,26,.18));transition:transform .5s var(--ease)}
.cert-frame:hover img{transform:scale(1.015)}
.cert-frame:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cred-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.cred-stats button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface);display:grid;gap:6px;transition:transform .35s var(--ease),border-color .35s}
.cred-stats button:hover{border-color:var(--gold);transform:translateY(-3px)}
.cred-stats button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cred-stats b{font-family:var(--f-display);font-size:42px;line-height:1;color:var(--navy);font-weight:500;font-variant-numeric:tabular-nums}
.cred-stats span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rowi{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto;gap:28px;align-items:center;padding:24px 8px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;transition:background .3s,padding .4s var(--ease);width:100%;animation:fadeup .6s var(--ease) both}
.rowi:hover{background:var(--surface);padding-left:20px}
.rowi .when{font-size:13px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.rowi h3{font-family:var(--f-display);font-size:28px;line-height:1.15}
.rowi .org{font-size:13px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rowi .arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:all .35s var(--ease)}
.rowi:hover .arrow{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);transform:rotate(-45deg)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.empty p{margin-bottom:16px}

/* journey */
.timeline{position:relative;margin-top:40px;padding-left:0}
.year{display:grid;grid-template-columns:120px minmax(0,1fr);gap:32px;padding-bottom:12px}
.year>h3{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--gold);position:sticky;top:96px;align-self:start}
.year ol{list-style:none;margin:0;padding:0 0 0 28px;border-left:1px solid var(--line)}
.year li{position:relative;padding:4px 0 28px}
.year li::before{content:"";position:absolute;left:-34px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--navy)}
.year li.planned::before{border-style:dashed;border-color:var(--gold)}
.year li button{all:unset;cursor:pointer;display:block}
.year li button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.year .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.year h4{font-family:var(--f-display);font-size:26px;line-height:1.2;transition:color .2s}
.year li button:hover h4{color:var(--gold)}
.year .o{color:var(--muted);font-size:14px;font-weight:300}

/* contact */
.contact{margin-top:96px;background:var(--cover);color:#EEF1F8;position:relative;overflow:hidden}
.contact .wrap{position:relative;padding-block:96px}
.contact .label{color:#B9C3D8}
.contact h2{font-family:var(--f-display);font-size:clamp(44px,7vw,88px);line-height:.98;margin:18px 0 22px;max-width:14ch}
.contact h2 em{color:#D3B77B}
.contact .lead{color:#C4CCDD;font-weight:300;font-size:18px;max-width:50ch}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:44px}
.ccard{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;border:1px solid rgba(211,183,123,.28);background:rgba(255,255,255,.04);color:#EEF1F8;text-decoration:none;text-align:left;transition:background .3s,border-color .3s,transform .35s var(--ease);min-width:0}
.ccard:hover{background:rgba(255,255,255,.08);border-color:#D3B77B;transform:translateY(-3px)}
.ccard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(211,183,123,.15);color:#D3B77B;flex:none}
.ccard small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9FAAC2}
.ccard span.v{display:block;font-size:15px;overflow-wrap:anywhere}
.ccard .act{margin-left:auto;color:#9FAAC2}
.contact .ctas{margin-top:36px}
.contact .btn{border-color:rgba(238,241,248,.35);background:transparent;color:#EEF1F8}
.contact .btn.gold{background:#D3B77B;border-color:#D3B77B;color:#16110A}

footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:28px 40px;color:var(--muted);font-size:13px;letter-spacing:.04em}

.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:opacity .3s,transform .3s var(--ease)}
.fab[data-show="false"]{opacity:0;transform:translateY(12px);pointer-events:none}
body.editing .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* layers */
.layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(5,10,22,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.case{position:absolute;inset:0;overflow-y:auto;background:var(--bg);animation:slideup .55s var(--ease) both}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.case-bar{position:sticky;top:0;z-index:3;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.case-bar .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.case-bar .pos{font-size:13px;color:var(--muted);margin-right:auto;letter-spacing:.06em}
.case-cover{position:relative;height:min(46vh,440px);background:var(--cover);overflow:hidden}
.case-cover img,.case-cover svg{width:100%;height:100%;object-fit:cover;display:block}
.case-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,12,26,.85),rgba(6,12,26,.1) 60%)}
.case-cover .wrap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-block:32px;color:#F3F5FA}
.case-cover .label{color:#D3B77B}
.case-cover h1{font-family:var(--f-display);font-size:clamp(40px,6vw,76px);line-height:1;margin-top:10px;max-width:18ch}
.case-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:64px;padding-block:56px 40px}
.case-lead{font-family:var(--f-display);font-style:italic;font-size:clamp(24px,3vw,30px);line-height:1.35;margin-bottom:40px}
.case-sec{display:grid;grid-template-columns:130px minmax(0,1fr);gap:24px;padding:28px 0;border-top:1px solid var(--line)}
.case-sec h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500;padding-top:4px}
.case-sec p{white-space:pre-line;font-weight:300;font-size:17px}
.side{display:flex;flex-direction:column;gap:22px;position:sticky;top:90px;align-self:start}
.side dl{margin:0;display:flex;flex-direction:column;gap:18px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--surface)}
.side dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.side dd{margin:2px 0 0;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 44px}
.fact{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;background:var(--surface);animation:fadeup .7s var(--ease) both;position:relative;overflow:hidden}
.fact b{display:block;font-family:var(--f-display);font-size:36px;line-height:1;font-weight:500;color:var(--navy);margin-bottom:8px}
.fact span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;animation:grow 1s var(--ease) .3s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.gallery button{position:relative}
.gallery .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(6,12,26,.82));color:#F3F5FA;font-size:13px;line-height:1.35;text-align:left}
.lb-cap{color:#E3E8F2;text-align:center;padding:0 24px 4px;font-size:14px;min-height:1.4em}
.case-cover img{object-position:center 62%}
.card .cover>img{object-position:center 72%}
.lb-stage{overflow:hidden}
.lb-stage img{max-height:calc(100dvh - 200px);object-fit:contain}
.feat-star{position:absolute;top:12px;right:12px;background:var(--gold);color:#16110A;border-radius:999px;padding:4px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.feat-star .flower{width:14px;height:14px;color:#16110A}
.viz{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px;margin:0 0 44px;min-width:0}
.viz-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.viz-tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.viz-tabs button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .3s,color .3s}
.viz-tabs button[aria-selected="true"]{background:var(--navy);color:var(--navy-ink)}
.viz-stage{position:relative;margin-top:18px;min-height:120px}
.viz-stage>svg{width:100%;height:auto;display:block;overflow:visible}
.verdict svg.i{width:16px;height:16px}
.viz-tip{position:absolute;z-index:2;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 11px;border-radius:8px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;box-shadow:var(--shadow)}
.viz-tip b{font-weight:600}
.viz-note{color:var(--muted);font-size:14px;font-weight:300;margin-top:12px}
.cap-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.cap-stats div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cap-stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.cap-stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid currentColor;margin-top:14px}
.verdict.bad{color:var(--danger)}.verdict.good{color:var(--ok)}
.cz-causes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cz-cause{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;opacity:0;transform:translateY(8px);animation:czIn .5s forwards}
.cz-cause .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--navy)}
.cz-cause b{display:block;font-weight:600;font-size:15px}
.cz-cause span{color:var(--muted);font-size:14px}
.cz-arrow{display:flex;justify-content:center;margin:12px 0;color:var(--gold)}
.cz-arrow svg{width:26px;height:26px;transform:rotate(90deg)}
.cz-result{border-radius:12px;padding:16px 18px;background:var(--navy);color:var(--navy-ink);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;opacity:0;animation:czIn .5s forwards}
.cz-result .label{color:inherit;opacity:.75}
.cz-result b{font-size:19px;font-weight:600}
@keyframes czIn{to{opacity:1;transform:none}}
.cz-space{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.cz-plan svg{width:100%;height:auto;display:block}
.cz-zone{cursor:pointer}
.cz-zone rect{transition:fill .4s,stroke-width .2s}
.cz-zone:focus{outline:none}
.cz-zone:focus-visible rect,.cz-zone.sel rect{stroke-width:4}
.cz-toggle{display:inline-flex;gap:4px;padding:4px;background:var(--sunk);border-radius:999px;margin-bottom:12px}
.cz-toggle button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--muted)}
.cz-toggle button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.cz-insp{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.cz-insp h4{font-size:20px;font-weight:600;margin:0}
.cz-ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cz-ba div{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.cz-ba .b{background:var(--sunk)}
.cz-ba .a{background:var(--navy);color:var(--navy-ink)}
.cz-ba small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.cz-insp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.cz-insp dt{color:var(--muted)}.cz-insp dd{margin:0;font-weight:500}
.cz-rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cz-rules>div{border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--navy)}
.cz-rules>div.no{border-top-color:var(--s3)}
.cz-rules h4{margin:0 0 8px;font-size:16px;font-weight:600}
.cz-rules ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
@media (max-width:760px){.cz-causes,.cz-rules,.cz-ba{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cz-cause,.cz-result{animation:none;opacity:1;transform:none}}
.viz-table{overflow-x:auto;max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.viz-table table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.viz-table th,.viz-table td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.viz-table th{position:sticky;top:0;background:var(--sunk);font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.viz-table td:first-child,.viz-table th:first-child{text-align:left}
.gallery video{width:100%;height:100%;object-fit:cover;display:block}
.gallery .play{position:absolute;top:10px;left:10px;background:var(--glass);border-radius:999px;padding:3px 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.lb-stage video{max-width:100%;max-height:calc(100dvh - 200px);border-radius:6px}
.lb-strip .vthumb{width:100%;height:100%;display:grid;place-items:center;background:#1b2440;color:#D3B77B;font-size:10px;letter-spacing:.1em}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbars h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:10px 0 2px}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:14px}
.hbar .tr{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .fl{height:100%;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--navy) 38%,var(--surface));transform-origin:0 50%;animation:barin .9s var(--ease) both}
.hbar.best .fl{background:var(--navy)}
.hbar .vl{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.hbar .nm{color:var(--ink)}
.hbar.best .nm::after{content:" ★";color:var(--gold)}
@keyframes barin{from{transform:scaleX(0)}}
.cm{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;max-width:520px;font-variant-numeric:tabular-nums}
.cm .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:6px}
.cm .rh{justify-content:flex-end;padding-right:10px}
.cm .c{aspect-ratio:1.6;max-width:100%;display:grid;place-items:center;border-radius:6px;font-family:var(--f-display);font-size:28px;transition:transform .25s var(--ease)}
.cm .c:hover{transform:scale(1.05)}
.cm-axis{font-size:12px;color:var(--muted);margin:6px 0 0}
.pipe{list-style:none;margin:0;padding:0;position:relative}
.pipe li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative;transition:opacity .4s}
.pipe li::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.pipe li:last-child::before{display:none}
.pipe .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--navy);border:1px solid var(--line);transition:background .4s,color .4s}
.pipe li.on .dot{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.pipe li.wait{opacity:.35}
.pipe .st{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
.pipe .nm{font-weight:500;margin:2px 0 4px}
.pipe .out{font-size:14px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;white-space:pre-line}
.pipe .out b{color:var(--ink);font-weight:500}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips-sel button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips-sel button[aria-pressed="true"]{border-color:var(--s1);color:var(--ink);background:color-mix(in srgb,var(--s1) 12%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink);margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.bar{height:12px;width:12px;border-radius:3px}
.be-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px;font-variant-numeric:tabular-nums}
.be-table th,.be-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.be-table th:first-child,.be-table td:first-child{text-align:left}
.be-table th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eng-ctrl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--sunk);border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.eng-ctrl .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.eng-angle{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.eng-angle input{flex:1;accent-color:var(--s1)}
.eng-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:12px}
.eng-read div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.eng-read b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.05;font-weight:500;font-variant-numeric:tabular-nums}
.eng-read span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hbar .tr{position:relative}
.hbar .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);border-radius:1px}
.tgt-key{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.tgt-key i{width:2px;height:14px;background:var(--gold);display:inline-block}
.agenda{display:flex;flex-direction:column;gap:18px}
.ag-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.ag-row .nm{font-weight:500;font-size:14px}
.ag-row .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-bar{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden;position:relative}
.ag-bar span{display:block;height:100%;cursor:default;transition:filter .2s,transform .2s;transform-origin:50% 100%}
.ag-bar span:hover,.ag-bar span:focus{filter:brightness(1.15);transform:scaleY(1.12);outline:none}
.ag-list{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.ag-list b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.ag-day{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;margin-bottom:6px}
.ag-day span{display:block;height:100%}
.ag-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px}
.db{display:flex;flex-direction:column;gap:16px}
