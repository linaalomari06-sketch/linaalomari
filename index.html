d": "", "status": "done", "summary": "Over three days at the LOYAC Innovation Camp in the Ajloun Forest Reserve, our team took on Beit Al-Fann, a 1920s heritage house in downtown Amman that almost nobody visits. We traced why, designed a weekly activities program with media coverage at its core, and pitched it with a working website prototype.", "problem": "Beit Al-Fann (بيت الفن الأردني) was built in the 1920s, served as Al-Zahra' Girls' School from 1938 to 1995, and reopened as a house of art in 2002 under Greater Amman Municipality. Today it gets almost no visitors.\n\nWe traced this to four root causes. It has no official source: no website and no contact details. It has no management: no reception and no security. It has no media team and no social media presence at all. And it has no signs, so from the street it looks like a private home, not a place you're allowed to walk into. The result is more than empty rooms: the house has had actual robberies.", "approach": "We started from root causes, not solutions. We defined our primary users as artists, both established and emerging, and young people who are passionate about art. Then we brainstormed solutions across activities, media coverage and the building itself, and scored them to pick the strongest one.\n\nEvery idea had to stay inside the heritage red lines. Jordan's Urban and Architectural Heritage Protection Law (No. 5 of 2005) bans damage to heritage sites and requires committee approval for any change, so nothing could be drilled, fixed or added to the building.\n\nOur solution runs in three steps. First, build the team: management and security, reception, media, and instruments for the workshops, made possible by university volunteers and sponsors. Second, run a weekly program: debates between old and new artists, a 3-week art residency, monthly art workshops that end in an exhibition, and music workshops that end in a performance. Third, and most important, the media team covers and posts every activity.", "outcome": "We presented the idea in a 10-slide pitch deck and demoed a bilingual (Arabic and English) website prototype. Visitors can book a free spot at each event instead of showing up blindly. Artists can apply for the residency or request a room for a workshop, which the management team approves before the media team announces it. The prototype also walks through the house zone by zone, today and with the program, alongside the heritage rules every activity follows.\n\nI received a certificate of participation from LOYAC.", "link": "", "facts": [{"v": "3 days", "l": "Camp in the Ajloun Forest Reserve"}, {"v": "4", "l": "Root causes traced"}, {"v": "4", "l": "Activities in the weekly program"}, {"v": "AR · EN", "l": "Bilingual website prototype"}], "tags": ["Design thinking", "Root cause analysis", "User definition", "Brainstorming & solution scoring", "Heritage regulations", "Pitch deck", "Website prototype", "Presenting"], "images": [{"id": "cb4515a9a3aa46c610e6637b4d8d431b", "kind": "image", "caption": "Beit Al-Fann, the 1920s heritage house on Prince Muhammad Street, downtown Amman"}, {"id": "38f3f8eb9bd8011f145b3ef279671bed", "kind": "video", "caption": "Three days at the LOYAC Innovation Camp"}, {"id": "d59e765a4be575066fd573491c0467c8", "kind": "image", "caption": "With my certificate of participation"}, {"id": "006e0df2f6f262b0d75fab47989ef159", "kind": "image", "caption": "Camp participants in the Ajloun Forest Reserve"}, {"id": "afd5f25e66678e401ac9d8dfd6268dda", "kind": "image", "caption": "Our group overlooking the Ajloun hills"}, {"id": "e4987679835de3310db2ca3e56883de1", "kind": "image", "caption": "Pitch deck: the root causes behind an empty house"}, {"id": "f299b332d40b1eb2fae634c82fa39e97", "kind": "image", "caption": "Pitch deck: our idea in three steps"}, {"id": "0cf7dd9599f216777a56bb2514eafef9", "kind": "image", "caption": "Pitch deck: the weekly program"}, {"id": "bcc92c57217839ebde9c1475ce7f90ae", "kind": "image", "caption": "Pitch deck: one website for visitors and artists"}, {"id": "cedc8d4b51ea2652fb19f5802a866e95", "kind": "image", "caption": "Website prototype: home page with the next weekly debate and free-spot booking"}, {"id": "8c50b38642197994f0465f891c106cdd", "kind": "image", "caption": "Website prototype: the house zone by zone, today and with the program"}, {"id": "148027c9174d4ae94ef724e61f57ee23", "kind": "image", "caption": "Website prototype: residency application with the heritage rules built in"}, {"id": "e5a7e9ab79172d020164e5b3137956db", "kind": "image", "caption": "Website prototype: the Arabic version"}, {"id": "7be9ec1671f81ddac1aab57b7d83a6a1", "kind": "image", "caption": "The house today"}], "viz": {"kind": "camp", "title": "From an empty house to a living one", "causes": [{"icon": "link", "n": "No official source", "d": "No website and no contact details, so there's nowhere to find out what's on."}, {"icon": "user", "n": "No management", "d": "No reception and no security, so nobody welcomes visitors or protects the house."}, {"icon": "image", "n": "No media team", "d": "No social media presence at all, so nobody knows the house exists."}, {"icon": "pin", "n": "No signs", "d": "From the street it looks like a private home, not a place open to visitors."}], "result": "No visitors, and actual robberies at the house.", "plan": [{"name": "Build the team", "icon": "user", "out": "Management and security, reception, media, and instruments for the workshops, made possible by university volunteers and sponsors."}, {"name": "Run the activities", "icon": "star", "out": "Weekly debates between old and new artists, a 3-week art residency, monthly art workshops with an exhibition, and music workshops that end in a performance."}, {"name": "Media coverage", "icon": "image", "out": "The most important job: the media team covers and posts every activity, to reach as many people as possible."}, {"name": "One website", "icon": "link", "out": "Visitors book a spot for each event. Artists request a room, management approves it, and the media team announces it."}], "zones": [{"k": "A", "x": 0, "y": 0, "w": 600, "h": 46, "t": "Entrance & reception", "now": "Closed door, no sign, nobody at the entrance to welcome visitors.", "live": "A reception desk at the door, security on duty, and bilingual signs on the street.", "rm": "Reception & security team", "by": "University volunteers", "fix": "No reception, no security, no signs"}, {"k": "B", "x": 30, "y": 70, "w": 250, "h": 200, "t": "Debate hall", "now": "The same display for years, rooms unwatched, and items have gone missing.", "live": "Weekly debates between old and new artists, with security watching every room.", "rm": "Management team", "by": "Sponsors", "fix": "No activities, robberies"}, {"k": "C", "x": 30, "y": 280, "w": 250, "h": 150, "t": "Workshop room", "now": "Heritage wings: music, theatre, radio & TV, crafts, folk costumes.", "live": "The heritage wings stay as they are. One room becomes a 12-seat workshop room for painting and embroidery.", "rm": "Management team", "by": "Sponsors (materials)", "fix": "Nothing to do at the house"}, {"k": "D", "x": 300, "y": 70, "w": 280, "h": 230, "t": "Residency studio", "now": "Unused open ground. The largest space on the plot sits empty.", "live": "Home of the art residency: 4 residents work here for 3 weeks, then open the studio to visitors.", "rm": "Management team", "by": "Sponsors", "fix": "No place for artists to create"}, {"k": "E", "x": 300, "y": 320, "w": 280, "h": 110, "t": "Media corner", "now": "Nobody films or posts anything, so nobody knows the house exists.", "live": "Base for the media team: every activity is filmed, photographed and posted the same week.", "rm": "Media team", "by": "University volunteers", "fix": "No media coverage"}], "will": ["Use freestanding, weighted panels and light stands", "Lay the stage deck on rubber feet over the existing paving", "Cap capacity per room and keep food outdoors", "Brief every artist on heritage rules before they install", "Get the municipality's heritage committee approval before the pilot"], "never": ["Drill, nail, glue or paint original walls, tiles or arches", "Alter the façade, openings or the twin spiral staircase", "Add floors, extensions or permanent structures", "Move or lend the heritage collection", "Play amplified sound past agreed limits or hours"], "notes": {"causes": "Four root causes from our field analysis, all leading to the same result: an empty, unprotected house.", "plan": "Our solution in order. Press Replay to step through it.", "house": "Schematic, not to scale: the plot is 1,269 m² and the building 402 m² over two floors. Tap a zone, then switch between Today and With the program.", "rules": "Based on Jordan's Urban and Architectural Heritage Protection Law No. 5 of 2005: Art. 11 bans damage to heritage sites, and Art. 12 requires prior committee approval for any change."}}}, {"id": "almazraa", "type": "project", "featured": false, "title": "Statistical Process Control at Al Mazraa Dairy", "org": "Statistical Process Control (106230) · HTU", "role": "Team project · factory field study", "team": "", "date": "2025-10", "end": "2026-01", "status": "done", "summary": "An SPC study of soft labneh production at Al Mazraa Dairy in Amman. We visited the factory to measure a critical quality characteristic on the line, then built control charts, a capability study and an improvement plan.", "problem": "Soft labneh is one of Al Mazraa's highest-demand products, and one of the most sensitive to process changes. Its critical-to-quality characteristics have tight limits: total solids 23.5% (23–24%), pH 4.1 (4.0–4.2), salt 1.05% (1.0–1.1%) and fill weight 5.0 kg (4.9–5.1 kg).\n\nWe focused on total solids because it sets the thickness and texture. Too low and the labneh turns watery, too high and it's too thick for customers.", "approach": "On our factory visit we mapped the process (pasteurization, fermentation, extraction, mixing and filling), the inspection points, and who measures and records what. Total solids was sampled every 30 minutes in subgroups of 5 and tested with calibrated lab equipment. We measured 27 values and, following the brief, extended them to 25 subgroups of 5 to build the charts.\n\nWe grouped the data with Sturges' rule, calculated the mean, range and standard deviation by hand and checked them against Minitab. Then we built X̄-R charts for total solids and a p-chart for defective units (25 samples of 50), both by hand and in Minitab. The p-chart used illustrative defect counts, because defects couldn't be observed directly during the visit.\n\nTo finish, we ran a capability study (Cp and Cpk), a histogram and time-series plot, and a cause-and-effect diagram for fermentation temperature deviation.", "outcome": "The X̄-R and p-charts showed the process is in statistical control: every point is inside the limits, with no runs or trends. But it isn't capable. Cp is 0.51 and Cpk is 0.45, well below the 1.33 expected for a critical food characteristic. The spread is too wide for the 23–24% spec, and the mean (23.45%) sits slightly low, so the biggest risk is at the lower limit.\n\nOur improvement plan:\n• Reduce input variation: tighter total-solids specs for raw-milk suppliers, more incoming checks, and blending milk before production.\n• Standardize fermentation temperature, fermentation time and mixing settings, with regular sensor calibration.\n• Train operators on an out-of-control action plan (OCAP).\n• Keep X̄-R and p-chart monitoring (subgroups of 5 every 1–2 hours, 50 units per shift) until Cpk reaches 1.33.", "link": "", "facts": [{"v": "25 × 5", "l": "Subgroups for X̄-R"}, {"v": "In control", "l": "X̄-R and p-charts"}, {"v": "0.51", "l": "Cp"}, {"v": "0.45", "l": "Cpk, goal ≥ 1.33"}], "tags": ["Minitab", "X̄-R chart", "p-chart", "Process capability", "Sturges' rule", "Cause-and-effect", "OCAP", "Food & dairy"], "viz": {"kind": "spc", "title": "Total solids (%) in soft labneh", "unit": "%", "subgroups": [[23.3, 23.4, 23.5, 23.2, 23.4], [23.4, 23.5, 23.3, 23.4, 23.6], [23.2, 23.3, 23.4, 23.5, 23.4], [23.5, 23.6, 23.4, 23.5, 23.3], [23.4, 23.5, 23.6, 23.4, 23.5], [23.3, 23.4, 23.5, 23.4, 23.6], [23.5, 23.4, 23.6, 23.5, 23.4], [23.4, 23.3, 23.5, 23.4, 23.6], [23.6, 23.5, 23.4, 23.6, 23.5], [23.4, 23.5, 23.3, 23.4, 23.6], [23.5, 23.6, 23.4, 23.5, 23.4], [23.4, 23.3, 23.5, 23.4, 23.6], [23.6, 23.5, 23.4, 23.5, 23.6], [23.4, 23.5, 23.6, 23.4, 23.5], [23.5, 23.4, 23.6, 23.5, 23.4], [23.4, 23.5, 23.3, 23.4, 23.6], [23.6, 23.5, 23.4, 23.6, 23.5], [23.5, 23.4, 23.6, 23.5, 23.4], [23.4, 23.5, 23.6, 23.4, 23.5], [23.5, 23.6, 23.4, 23.5, 23.3], [23.4, 23.5, 23.6, 23.4, 23.5], [23.6, 23.5, 23.4, 23.6, 23.5], [23.5, 23.4, 23.6, 23.5, 23.4], [23.4, 23.5, 23.6, 23.4, 23.5], [23.5, 23.6, 23.4, 23.5, 23.4]], "xbar": {"cl": 23.4664, "ucl": 23.6025, "lcl": 23.3303}, "r": {"cl": 0.236, "ucl": 0.499, "lcl": 0}, "cap": {"mean": 23.45, "sigma": 0.33, "lsl": 23.0, "usl": 24.0, "target": 23.5, "cp": 0.51, "cpk": 0.45, "goal": 1.33}, "notes": {"xbar": "All 25 subgroup means fall inside the control limits, with no runs or trends, so the process is in statistical control. Hover over a point to see that subgroup.", "r": "Ranges stay inside their limits, so the spread within each subgroup is stable over time.", "cap": "Stable but not capable: the natural spread (σ = 0.33) is too wide for the 23–24% spec, and the mean sits a little below target. Hover to read off the share of output below any value.", "data": "Subgroup values from the report's data table. Control limits are the Minitab results; capability uses the mean and standard deviation from the hand calculations."}}, "images": [{"id": "9ea0f70b3b1ad2c1fcfa8686a2b89a2a", "kind": "image", "caption": "Recording quality measurements during our visit to Al Mazraa Dairy"}, {"id": "8f8410d2c0e6c54ae5152ceffed39d66", "kind": "video", "caption": "Soft labneh in production"}, {"id": "6499cd77b2d22958b05b29d4175b9cd5", "kind": "image", "caption": "The filling and packaging area on the factory floor"}, {"id": "4ce7af4426565f68b9234e3eeb9763ab", "kind": "image", "caption": "Soft labneh process, from raw milk to filling"}, {"id": "a25a77e4a9a6688e49bd1e43a14ab75e", "kind": "image", "caption": "Critical-to-quality characteristics and their targets"}, {"id": "f5bdf7e788c520fad6113fbdf91a79c0", "kind": "image", "caption": "X̄-R chart in Minitab: every subgroup in control"}, {"id": "4a82b8d1400e869a4c5e7b0f396b9280", "kind": "image", "caption": "p-chart for defective units"}, {"id": "2c3d30e18322e93e2fa81b82dc7b7071", "kind": "image", "caption": "Capability: stable, but not capable (Cp 0.51, Cpk 0.45)"}, {"id": "d7b211f0335f6accd620539c5cf11b0d", "kind": "image", "caption": "Hand calculation of Cp and Cpk, checked against Minitab"}, {"id": "91df1c91c30ee8ca4889e429187630c7", "kind": "image", "caption": "Cause-and-effect diagram for fermentation temperature deviation"}, {"id": "f198cce074a33b815a0aacbb3f003cac", "kind": "image", "caption": "Corrective action plan"}, {"id": "ad354131bae312151cd538bc9f722c85", "kind": "image", "caption": "Conclusions and recommendations"}]}, {"id": "complaint-ai", "type": "project", "featured": false, "cover": "pattern", "title": "Voice-Enabled AI Complaint & Risk Analyzer", "org": "Introduction to AI & Data Sciences (106200) · HTU", "role": "Team project · individual report", "team": "", "date": "2026-03", "end": "2026-06", "status": "done", "summary": "A voice-enabled system for HTU that takes a spoken or typed complaint, works out its category and risk level, pulls out details like IDs, dates and locations, and speaks a response back.", "problem": "HTU receives complaints about IT, labs, facilities, registration, parking and campus safety, mostly as free text or face to face. Handling them by hand is slow, and urgent safety issues can get lost among routine ones.\n\nWe surveyed 50 HTU users: 27 students, 10 instructors, 7 staff and 6 visitors. 56% said urgent complaints aren't handled fast enough and another 32% weren't sure, and voice was the most requested way to report after text. That turned a vague goal into a specific one: classify each complaint, predict its risk, extract the key details, and escalate the urgent ones.", "approach": "I framed the work with the seven analytics domains, from business and analytics problem framing through data, methodology, model building, deployment and lifecycle management.\n\nRisk level: a 1,000-record dataset of 24 keyword features with balanced Low, Medium and High classes. After checking for nulls and duplicates, label encoding and scaling (fitted on the training set only, to avoid data leakage), we compared Logistic Regression, Random Forest (tuned trees and depth), KNN (k from 1 to 20) and an ANN.\n\nComplaint category: 900 free-text complaints across IT, Maintenance, Security and Facility. The text was cleaned, tokenized, padded to 50 tokens and fed to an ANN with an embedding layer. We compared a small embedding model, a tuned one (64-dimension embeddings, two dense layers with dropout) and a bag-of-words model.\n\nThe best models were saved with pickle and joined into one pipeline: speech-to-text, regex extraction of student ID, date, room, lab, floor, building and place, both predictions, and a spoken reply through text-to-speech.", "outcome": "Logistic Regression predicted risk best, at 92.5% test accuracy, ahead of Random Forest (91.5%), the ANN (90%) and KNN (88%). That's a good reminder that a more complex model isn't always better on structured keyword data. For categories, the tuned embedding ANN reached 100% on both validation and test data, while bag-of-words stayed close to chance (23.9%), which shows how much the embeddings capture. A perfect score most likely reflects how templated the provided dataset is, so I flagged it rather than treating it as a win.\n\nThe integrated prototype runs end to end from voice or text. Next steps I identified: move risk prediction from 24 fixed keywords to text embeddings, monitor predictions against real outcomes to catch drift, use an explicit severity encoding, and retrain on real HTU complaint logs each semester.", "link": "", "facts": [{"v": "92.5%", "l": "Risk accuracy (Logistic Regression)"}, {"v": "100%", "l": "Category accuracy (tuned ANN)"}, {"v": "50", "l": "HTU users surveyed"}, {"v": "7", "l": "Analytics domains applied"}], "tags": ["Python", "scikit-learn", "TensorFlow / Keras", "NLP embeddings", "Speech-to-text", "Text-to-speech", "Regex", "Logistic Regression", "Random Forest", "KNN", "ANN"], "viz": {"kind": "ml", "title": "From a spoken complaint to a decision", "tabs": [["pipe", "Pipeline"], ["models", "Models"], ["cm", "Confusion matrix"], ["survey", "Survey"]], "pipeline": {"steps": [{"name": "Voice input", "icon": "phone", "out": "The user picks voice and speaks the complaint (60-second window)."}, {"name": "Speech-to-text", "icon": "file", "out": "“it was observed that Corridor lights are not functioning around the lecture hall ID 1411 01555 the date is 6 August 2026”"}, {"name": "Regex entity extraction", "icon": "search", "out": "Date: 6 August 2026 · General place: Corridor\nStudent ID, room, lab, floor, building: not found"}, {"name": "Category: tuned embedding ANN", "icon": "flag", "out": "Facility"}, {"name": "Risk level: Logistic Regression", "icon": "star", "out": "Low"}, {"name": "Spoken reply: text-to-speech", "icon": "mail", "out": "“Complaint was received. The predicted category is Facility. The risk level is Low. The date is 6 August 2026.”"}]}, "models": [{"title": "Risk level · test accuracy", "max": 100, "rows": [{"n": "Logistic Regression", "v": 92.5, "label": "92.5%", "best": true}, {"n": "Random Forest", "v": 91.5, "label": "91.5%"}, {"n": "ANN", "v": 90, "label": "90.0%"}, {"n": "KNN (k = 18)", "v": 88, "label": "88.0%"}]}, {"title": "Complaint category · test accuracy", "max": 100, "rows": [{"n": "Tuned embedding ANN", "v": 100, "label": "100%", "best": true}, {"n": "Embedding ANN", "v": 98.9, "label": "98.9%"}, {"n": "Bag-of-words ANN", "v": 23.9, "label": "23.9%"}]}], "cm": {"labels": ["Low", "Medium", "High"], "m": [[56, 5, 4], [3, 78, 0], [3, 0, 51]]}, "survey": [{"title": "Who answered (50 HTU users)", "rows": [{"n": "Students", "v": 27, "label": "27"}, {"n": "Instructors", "v": 10, "label": "10"}, {"n": "Staff", "v": 7, "label": "7"}, {"n": "Visitors", "v": 6, "label": "6"}]}, {"title": "Are urgent complaints handled fast enough?", "rows": [{"n": "No", "v": 28, "label": "56%", "best": true}, {"n": "Not sure", "v": 16, "label": "32%"}, {"n": "Other answers", "v": 6, "label": "12%"}]}], "notes": {"pipe": "A real run from the notebook: the complaint was spoken, transcribed, analysed and answered out loud. Select Replay to watch it step by step.", "models": "Each model was tested on the same held-out 20% of the data. The starred model was chosen for the final system.", "cm": "Logistic Regression on the 200 held-out risk records. Most mistakes are between neighbouring levels, and no High-risk complaint was ever predicted as Medium.", "survey": "The survey shaped the problem statement: urgent complaints needed faster, automatic escalation, and voice input was worth building."}}, "images": [{"id": "3ea441d117ba71791dada87a538b3d1e", "kind": "image", "caption": "Correlation heatmap of the 24 keyword features against risk level"}, {"id": "806f2843481bdf9ef2f2a591f9283b95", "kind": "image", "caption": "Average keyword presence for each risk level"}, {"id": "89825883bc9c0f167b1fabcbd98410a5", "kind": "image", "caption": "Confusion matrix for Logistic Regression, the chosen risk model"}, {"id": "4ce6fbeffaa92807e5fa294433e15beb", "kind": "image", "caption": "Training and validation curves for the risk ANN"}, {"id": "58e6255f846dbc9f0541a31ffe6ced64", "kind": "image", "caption": "Tuned embedding ANN: accuracy and loss over 25 epochs"}, {"id": "c2af9300f7af734aeca46b94b6bf1173", "kind": "image", "caption": "Bag-of-words ANN: validation accuracy stays near chance"}, {"id": "fe03a8603967a6799957dfe47be10e08", "kind": "image", "caption": "Complaint categories in the 900-record dataset"}]}, {"id": "registration", "type": "project", "featured": false, "cover": "pattern", "title": "Fixing the Registration Bottleneck: A Lean Six Sigma Project", "org": "Quality and Process Improvement (106231) · HTU", "role": "Individual report", "team": "", "date": "2026-03", "end": "2026-06", "status": "done", "summary": "A full Lean Six Sigma DMAIC project on HTU's course registration process, backed by a survey of 50 students, with a Cost of Quality analysis and an ISO 9001:2015 implementation plan.", "problem": "Complaints about course registration at HTU had been rising for two semesters. Registering took students about 45 minutes, the system crashed at peak times, schedules clashed, and required sections closed early, which hit students close to graduation hardest. The extra work landed on academic advisors, IT and the finance department.\n\nThe goal I set: cut the average registration time from 45 to 20 minutes and reduce complaints by about 25% within one semester.", "approach": "Define: business case, problem and goal statements, scope, critical-to-quality targets (registration in 20 minutes or less, crashes reported by 5% or fewer, conflicts 10% or fewer, page response within 3 seconds, satisfaction of 85% or more), a SIPOC, a RACI matrix and a project charter.\n\nMeasure: a data collection plan and a Google Forms survey of 50 students, then frequency tables, a Pareto chart, cross-tabulations and a KPI baseline. I checked the data for accuracy, precision, repeatability and reproducibility.\n\nAnalyze: a service-process fishbone diagram, 5 Whys on the three biggest issues, an analysis of variation, and an FMEA to rank the root causes.\n\nImprove: solutions for each root cause scored on impact, cost, time and feasibility, force field analysis for the winners, an action plan, a pilot study and a risk analysis. I applied Lean tools: DOWNTIME waste analysis, Kaizen, a pull system and SMED.\n\nControl, cost and standards: a control plan with KPIs and monitoring, a Cost of Quality analysis, and a gap analysis against ISO 9001:2015 clauses 4 to 10.", "outcome": "The survey confirmed the problem: 78% of students needed more than 30 minutes to register, 54% hit schedule conflicts, 42% had filed complaints and average satisfaction was 1.88 out of 5. Closed sections, schedule conflicts and system crashes caused 72% of the issues, and students who registered during Add/Drop were far more likely to take over 45 minutes. Poor demand forecasting had the highest risk priority (RPN 432).\n\nI selected four solutions: demand forecasting from student surveys and historical data, a cross-department timetable review, staggered registration windows, and a simplified open-section approval process. Using SMED to move schedule-building before registration opens cuts active time in the system to an estimated 10–15 minutes.\n\nThe visible cost of poor quality came to about 19,270 JD per semester, with estimated savings of about 9,666 JD per semester. I closed with a six-phase plan to apply ISO 9001 to the registration process.", "link": "", "facts": [{"v": "50", "l": "Students surveyed"}, {"v": "72%", "l": "Of issues from the top 3 causes"}, {"v": "45 → 20 min", "l": "Registration time goal"}, {"v": "≈9,666 JD", "l": "Estimated savings per semester"}], "tags": ["Lean Six Sigma", "DMAIC", "SIPOC", "RACI", "Pareto", "Fishbone", "5 Whys", "FMEA", "Force field analysis", "SMED", "Kaizen", "Cost of quality", "ISO 9001:2015", "Excel"], "viz": {"kind": "dmaic", "title": "What the data said", "journey": [{"name": "Define", "icon": "flag", "out": "Business case, problem and goal statements (45 → 20 minutes, complaints −25%), scope, critical-to-quality targets, SIPOC, RACI and project charter."}, {"name": "Measure", "icon": "search", "out": "Survey of 50 students, frequency tables, Pareto chart, cross-tabs and the KPI baseline: 78% over 30 minutes, 54% conflicts, 42% complaints, satisfaction 1.88/5."}, {"name": "Analyze", "icon": "key", "out": "Fishbone, 5 Whys on the top three issues, variation analysis and an FMEA. Top root cause: poor demand forecasting (RPN 432)."}, {"name": "Improve", "icon": "star", "out": "Solutions scored on impact, cost, time and feasibility, force field analysis, action plan, pilot and risk plan. Lean: DOWNTIME, Kaizen, pull system, SMED."}, {"name": "Control", "icon": "file", "out": "Control plan with KPIs, daily system checks in registration weeks, documented procedures, staff training and semester reviews."}, {"name": "Cost of quality and ISO 9001", "icon": "mail", "out": "COPQ of about 19,270 JD per semester, about 9,666 JD in estimated savings, and a six-phase plan built on ISO 9001 clauses 4 to 10."}], "survey": [{"title": "How long registration took (50 students)", "rows": [{"n": "10–20 min", "v": 2, "label": "2"}, {"n": "20–30 min", "v": 9, "label": "9"}, {"n": "30–45 min", "v": 19, "label": "19"}, {"n": "Over 45 min", "v": 20, "label": "20", "best": true}]}, {"title": "Satisfaction with registration (1 = very low, 5 = very high)", "rows": [{"n": "1", "v": 17, "label": "17"}, {"n": "2", "v": 23, "label": "23", "best": true}, {"n": "3", "v": 9, "label": "9"}, {"n": "4", "v": 1, "label": "1"}, {"n": "5", "v": 0, "label": "0"}]}], "pareto": {"labels": ["Closed sections", "Schedule conflicts", "System crashes", "System delays", "Approval delays"], "values": [26, 24, 22, 16, 12]}, "timing": {"labels": ["Week 1", "Week 2", "Week 3", "Add/Drop"], "values": [30, 23.5, 41.7, 72.7], "counts": ["3 of 10", "4 of 17", "5 of 12", "8 of 11"]}, "fmea": [{"n": "Poor demand forecasting", "rpn": 432}, {"n": "Weak timetable coordination", "rpn": 280}, {"n": "Poor peak-load management", "rpn": 224}, {"n": "Students not prepared", "rpn": 216}, {"n": "Lengthy approval workflow", "rpn": 150}], "cost": [{"title": "Cost of poor quality per semester (JD)", "rows": [{"n": "Graduation delays", "v": 16000, "label": "16,000"}, {"n": "Advisor time", "v": 1500, "label": "1,500"}, {"n": "Registrar rework", "v": 1050, "label": "1,050"}, {"n": "IT crash handling", "v": 720, "label": "720"}]}, {"title": "Estimated savings per semester (JD), about 9,666 in total", "max": 16000, "rows": [{"n": "Fewer graduation delays", "v": 8000, "label": "8,000+", "best": true}, {"n": "Advisor time", "v": 900, "label": "900"}, {"n": "IT crash handling", "v": 504, "label": "504"}, {"n": "Complaint handling", "v": 262, "label": "262"}]}], "notes": {"journey": "The project followed DMAIC from start to finish, then added a Cost of Quality analysis and an ISO 9001 plan. Select Replay to step through it.", "survey": "Most students needed more than half an hour, and almost no one rated the process above 3 out of 5.", "pareto": "Three causes (closed sections, schedule conflicts and system crashes) account for 72% of the problems, so the Analyze phase focused on them.", "timing": "Students who registered late took much longer: 73% of those registering during Add/Drop needed more than 45 minutes.", "fmea": "Rated 1 to 10 for severity, occurrence and detection. Poor demand forecasting scored highest, so it became the first priority in the Improve phase.", "cost": "Graduation delays dominate the cost of poor quality. Student time lost (about 650 hours per semester) and reputation damage are left out of the totals because they're hard to put a number on."}}, "images": [{"id": "54b24f846ed6e233d15d5717932035d1", "kind": "image", "caption": "Project charter"}, {"id": "a36e08c6c45f9b01151541b69daec039", "kind": "image", "caption": "Fishbone diagram for the registration process"}, {"id": "76cfec3d5ebed8aab53bb629ae27d9af", "kind": "image", "caption": "5 Whys for closed sections, schedule conflicts and system crashes"}, {"id": "35161df3075e0e8f80315e77f20cd2a2", "kind": "image", "caption": "Force field analysis: demand forecasting"}, {"id": "b3b920f2b7e47979d84010d00f0b80a7", "kind": "image", "caption": "Force field analysis: cross-department timetable review"}, {"id": "82d3885169e2767854ff6afc738589e2", "kind": "image", "caption": "Force field analysis: staggered registration windows"}, {"id": "3efd263e7b8040d685aec6d65f1b08a2", "kind": "image", "caption": "Force field analysis: simplified open-section requests"}, {"id": "80bcff712f0fd05a0561802c57d4ce6d", "kind": "image", "caption": "Report cover illustration"}]}, {"id": "amazon-finance", "type": "project", "featured": false, "cover": "pattern", "title": "Financial Analysis of Amazon & a New Product Investment", "org": "Financial Analysis (106260) · HTU", "role": "Individual project", "team": "", "date": "2025-11", "end": "2026-01", "status": "done", "summary": "A full financial study of Amazon: five years of ratio analysis from its SEC 10-K filings, a budgeted income statement, and an engineering-economy evaluation of a new Amazon Echo production project, with sensitivity, break-even and scenario analysis.", "problem": "Acting as a financial analyst, I had to judge Amazon's financial health from its published statements, plan a budget for the next year, and decide whether a new capital project would be worth the investment.\n\nThe project I evaluated was producing Amazon Echo devices: a $70 million investment financed 50% by a 6% loan, 30 million units a year at $65 each, depreciated with 7-year MACRS, with customers paying within 60 days and suppliers paid within 30.", "approach": "Ratio analysis (2020–2024): I took the balance sheet, income statement and cash flow statement from Amazon's 10-K filings and calculated liquidity, profitability, efficiency, leverage and market ratios, then read each trend for strengths, weaknesses and gaps.\n\nBudget: a sales budget with 7% growth and a seasonal 22/23/25/30% quarterly split, then production, direct labor, overhead, COGS, selling and administrative budgets, adapted to Amazon as a retailer (no direct materials budget), all combined into a budgeted income statement.\n\nProject evaluation: a 2026–2030 income statement, loan repayment schedule and cash flow statement with net working capital and salvage value, then present, future and annual worth, IRR and payback at a 15% MARR. To finish, I ran a ±20% sensitivity analysis, a break-even analysis with Goal Seek, and pessimistic, most likely and optimistic scenarios.", "outcome": "Amazon's position improved over the period. The debt ratio fell from 0.71 to 0.54, gross margin rose from 40% to 49%, and profitability recovered strongly after the 2022 loss. The weak spots were cash liquidity (cash covers only about half of current liabilities) and assets growing faster than revenue.\n\nThe Echo project is feasible under the base assumptions: an NPW of $178.6 million, an annual worth of $53.3 million and an IRR of 24.7% against a 15% MARR. But it's very sensitive to price. At $60 a unit it failed, and the break-even price is $62.55, only 3.8% below plan. The pessimistic scenario gives an NPW of −$914.5 million. So I recommended protecting the price, cutting the $522.5 million working-capital need through faster collections and leaner inventory, locking in supplier costs, and repaying the loan early from later cash flows.", "link": "", "facts": [{"v": "$178.6M", "l": "NPW at 15% MARR"}, {"v": "24.7%", "l": "IRR vs 15% MARR"}, {"v": "$53.3M", "l": "Annual worth"}, {"v": "$62.55", "l": "Break-even price (plan $65)"}], "tags": ["Excel", "Ratio analysis", "Budgeting", "MACRS depreciation", "NPW · AW · FW", "IRR", "Sensitivity analysis", "Break-even (Goal Seek)", "Scenario analysis", "SEC 10-K"], "viz": {"kind": "fin", "title": "Amazon, then the Echo project", "ratios": {"years": ["2020", "2021", "2022", "2023", "2024"], "items": [{"key": "gm", "name": "Gross margin", "unit": "%", "values": [39.57, 42.03, 43.81, 46.98, 48.85], "note": "Gross margin climbed every year, from about 40% to 49%, a sign of steadily better cost management."}, {"key": "nm", "name": "Net margin", "unit": "%", "values": [5.53, 7.1, -0.53, 5.29, 9.29], "note": "Profitability dipped into a loss in 2022, then recovered strongly to its highest level in 2024. Stability is the gap."}, {"key": "roe", "name": "ROE", "unit": "%", "values": [22.84, 28.81, -1.91, 17.49, 24.29], "note": "Return on equity turned negative in 2022 and came back in 2023 and 2024, so shareholder returns recovered but swing year to year."}, {"key": "cr", "name": "Current ratio", "unit": "x", "values": [1.05, 1.14, 0.94, 1.05, 1.06], "ref": 1, "refLabel": "1.0", "note": "Short-term liquidity stayed stable around 1.0. It only dipped below 1 in 2022."}, {"key": "cash", "name": "Cash ratio", "unit": "x", "values": [0.67, 0.68, 0.45, 0.53, 0.56], "ref": 1, "refLabel": "1.0", "note": "Cash alone covers only about half of current liabilities, and the trend is down: the weakest point in Amazon's liquidity."}, {"key": "dr", "name": "Debt ratio", "unit": "x", "values": [0.71, 0.67, 0.68, 0.62, 0.54], "note": "The debt ratio fell from 0.71 to 0.54, so Amazon relies less on debt and carries less financial risk."}, {"key": "de", "name": "Debt-to-equity", "unit": "x", "values": [2.44, 2.04, 2.17, 1.61, 1.19], "ref": 1, "refLabel": "1.0", "note": "Debt-to-equity halved from 2.44 to 1.19, but debt is still higher than equity."}, {"key": "it", "name": "Inventory turnover", "unit": "x", "values": [17.43, 16.65, 15.33, 16.97, 18.89], "note": "Inventory slowed in 2022, then turned faster than ever: about 18.9 times in 2024."}, {"key": "dso", "name": "DSO", "unit": "d", "values": [23.2, 25.6, 30.1, 33.2, 31.7], "note": "Collecting receivables got slower until 2023 and improved slightly in 2024."}, {"key": "eps", "name": "EPS", "unit": "$", "values": [2.09, 3.24, -0.27, 2.9, 5.53], "note": "Earnings per share went negative in 2022, then more than recovered, reaching $5.53 in 2024."}]}, "cash": {"labels": ["Year 0", "2026", "2027", "2028", "2029", "2030"], "net": [-557.5, 140.97, 142.66, 141.34, 140.36, 668.65]}, "sens": {"labels": ["−20%", "Base", "+20%"], "series": [{"name": "Unit price", "values": [-769.3, 178.6, 1126.4]}, {"name": "Demand", "values": [-153.5, 178.6, 510.7]}, {"name": "Operating cost", "values": [465.2, 178.6, -108.0]}]}, "scen": {"labels": ["Pessimistic", "Most likely", "Optimistic"], "values": [-914.5, 178.6, 1823.6]}, "be": [{"name": "Unit price", "plan": "$65.00", "at": "$62.55", "headroom": 3.8}, {"name": "Variable cost / unit", "plan": "$39.50", "at": "$41.87", "headroom": 6.0}, {"name": "Sales volume", "plan": "30.0M units", "at": "26.8M units", "headroom": 10.8}, {"name": "Fixed costs / year", "plan": "$570M", "at": "$641M", "headroom": 12.5}], "notes": {"cash": "A $557.5 million outflow at year 0 (the $70 million investment plus working capital, minus the $35 million loan), then about $140 million a year. Working capital and salvage value come back in 2030. Hover over a year to see both values.", "sens": "Each input moved ±20% while the others stayed fixed. Unit price has the steepest line, so it matters most. Higher operating cost pulls NPW down.", "scen": "Pessimistic: demand −20%, price −10%, costs +10%. Optimistic: the reverse. The red bar marks the only scenario where the project isn't feasible.", "be": "Found with Goal Seek by setting NPW to zero, one input at a time. Price has the least room to move, which is why pricing was my first recommendation."}}, "images": []}, {"id": "training-design", "type": "project", "featured": false, "title": "Training Program Design for a Global Logistics Company", "org": "Professional Practice · HTU", "role": "Team project · led the communication materials", "team": "", "date": "2026-04", "end": "2026-05", "status": "done", "summary": "Designing, planning and evaluating a one-day training program in digital collaboration and conflict management for the mid-level managers of a global logistics company (a course case study), from the agenda and communication materials to a Microsoft Project schedule and an evaluation of pilot results.", "problem": "In the case, Lumina Global Logistics found its mid-level managers struggling with digital communication, virtual collaboration and handling conflict in remote teams. Acting as a training consultancy, our team had to design a one-day program to fix this and plan its delivery. Then we had to judge from pilot data (40 managers) whether it worked against the client's target of a 25% improvement on every metric.", "approach": "Design: a six-hour agenda in three sessions (digital communication, virtual team collaboration and conflict resolution), built around a quiz game, group work, a personality test, a collaboration-tool tutorial and role play.\n\nCommunication: I led the communication materials: the invitation, the participant agenda and a manager's quick-reference tip-sheet, all designed to suit busy logistics managers. The team also built a stakeholder communication matrix.\n\nPlanning: a 2.5-month schedule in Microsoft Project with a custom Sunday–Thursday calendar, four phases (research and design, material preparation, logistics and communication, evaluation planning), and a contingency plan for engagement, timing and technical risks.\n\nAnalysis: a 5 Whys root-cause analysis of low participation, a scoring matrix to choose the best solutions, facts–assumptions–analysis reasoning for two likely problems, and a comparison of OODA, PDCA and GROW. I chose PDCA to help managers apply the skills back at work.", "outcome": "The pilot met two of the three targets. Digital communication audit scores rose 31.25% (from 3.2 to 4.2 out of 5) and escalated misunderstandings fell 31.8% (from 22 to 15 a month), both above the 25% target. Collaborative task resolution improved only 12.4%.\n\nThe data explained why: confidence in managing shared workflows and project tools rose just 0.4 points, and managers said the company's project software was slow and hard to use. So the gap came partly from the tools, not only the skills. I recommended more hands-on practice with collaboration tools, fixing the workplace system issues, and a PDCA follow-up after the training.", "link": "", "facts": [{"v": "2 of 3", "l": "Client targets met"}, {"v": "+31.25%", "l": "Communication audit score"}, {"v": "31.8%", "l": "Fewer escalated misunderstandings"}, {"v": "6 h", "l": "One-day program, 3 sessions"}], "tags": ["Training design", "Stakeholder communication", "Microsoft Project", "Contingency planning", "5 Whys", "Decision matrix", "PDCA", "Critical reasoning"], "viz": {"kind": "training", "title": "From the agenda to the results", "agenda": {"start": 600, "end": 960, "blocks": [{"name": "Digital Communication", "c": "s1", "at": 600, "min": 90, "parts": [["Ice-breaking", 10], ["Interactive quiz game", 5], ["Common online communication issues", 20], ["Principles of online communication", 30], ["Group discussion: fixing real emails", 15], ["Wrap-up and Q&A", 10]]}, {"name": "Coffee break", "c": "brk", "at": 690, "min": 30}, {"name": "Virtual Team Collaboration", "c": "s2", "at": 720, "min": 120, "parts": [["Team dynamics and roles", 25], ["Personality test", 10], ["Online collaboration tool tutorial", 30], ["Group work with the tool", 30], ["Teamwork bottleneck analysis", 20], ["Wrap-up and Q&A", 5]]}, {"name": "Lunch break", "c": "brk", "at": 840, "min": 60}, {"name": "Conflict Resolution", "c": "s3", "at": 900, "min": 60, "parts": [["Most common conflicts", 15], ["Conflict resolution approaches", 20], ["Preventive measures", 10], ["Role play", 10], ["Wrap-up and Q&A", 5]]}]}, "plan": [{"n": "Research and design", "d": 15.75}, {"n": "Material preparation", "d": 15}, {"n": "Logistics and communication", "d": 9}, {"n": "Evaluation planning", "d": 6}], "results": [{"n": "Communication clarity (audit score)", "v": 31.25, "label": "+31.3%"}, {"n": "Escalated misunderstandings", "v": 31.8, "label": "31.8% fewer"}, {"n": "Collaborative task resolution time", "v": 12.4, "label": "12.4% faster"}], "conf": {"min": 1, "max": 5, "rows": [{"n": "Digital communication & etiquette", "pre": 2.8, "post": 4.4}, {"n": "Shared workflows & project tools", "pre": 3.1, "post": 3.5}, {"n": "Resolving conflicts virtually", "pre": 2.4, "post": 4.2}]}, "review": [{"n": "Clarity of objectives", "v": 4.6}, {"n": "Relevance of content", "v": 4.5}, {"n": "Theory vs practice balance", "v": 3.8}, {"n": "Duration and pacing", "v": 3.6}, {"n": "Use of collaboration tools", "v": 3.4}, {"n": "Match with workplace systems", "v": 3.2}], "notes": {"agenda": "The full six-hour day. Hover over or tab to any segment to see its time. Breaks are shown in grey on the overview strip.", "plan": "The longest phases were research and design and material preparation, because understanding the audience and getting the content right drives everything else.", "results": "Two objectives beat the 25% target (gold line). Collaborative task resolution fell short, largely because of the company's slow project software.", "conf": "Confidence rose sharply for communication and conflict resolution, but only 0.4 points for shared workflows and tools, which matches the weaker task-resolution result.", "review": "Objectives and content scored highest. Tool integration and the match with workplace systems scored lowest, which pointed to the main improvement for the next run."}}, "images": [{"id": "2579f1ce60ebccb2d75ecc9e7a31c995", "kind": "image", "caption": "The invitation I designed for participants"}, {"id": "020da3a5dcfa29ecf46c73f225c6f050", "kind": "image", "caption": "Participant agenda for the training day"}, {"id": "8ac5a26ea8cc9a440400d5f2cbb57363", "kind": "image", "caption": "Manager's quick-reference tip-sheet"}, {"id": "9ddb7d0a1ef48258661172ccf8803431", "kind": "image", "caption": "Tip-sheet panel: conflict resolution steps"}, {"id": "b7df83e4e47c44105e3955b99669f0aa", "kind": "image", "caption": "Brand mark used across the training materials"}]}, {"id": "air-engine", "type": "project", "featured": false, "title": "Scotch-Yoke Compressed Air Engine", "org": "STEM Lab II (102102) · HTU", "role": "Team project", "team": "", "date": "2026-08", "end": "2026-09", "status": "done", "summary": "A compact compressed-air piston engine that uses a Scotch-yoke mechanism instead of a connecting rod. We calculated it, modelled and animated it in SolidWorks, 3D-printed it in PLA under a 250 g limit, and it drove a small generator to light an LED.", "problem": "The brief was to design a small compressed-air engine for a mechanical energy-storage system, model it in SolidWorks, then print, assemble and test a working prototype that drives a generator. There were two hard limits: all 3D-printed parts together under 250 g, and a crank radius of 25 mm or less.\n\nOur main design goal was to replace the usual connecting rod with a Scotch yoke, which gives simple harmonic piston motion with fewer parts.", "approach": "Calculations: we chose a 20 mm crank radius (40 mm stroke) and sized the bore at 30 mm to get about 350 N of ideal force at 5 bar. From there we worked out the 28.3 cm³ swept volume, a peak torque of 7.07 N·m (2.25 N·m average), 14.15 J of work per stroke, ideal power at 3, 4 and 5 bar from 60 to 200 rpm, air consumption, a 70 mm flywheel and a part-by-part mass budget.\n\nCAD: we modelled the cylinder, piston, yoke, crankshaft with a D-flat, crank support, flywheel, base and cap in SolidWorks. We built the assembly with concentric, slot, screw and parallel mates, checked the clearances (0.35 mm on the piston, 0.5 mm on the pin slot), and made a 100 rpm motion animation.\n\nPrototype: we sliced the parts in Bambu Studio (PLA, 30% gyroid infill, tree supports), then printed, assembled and tested the engine on compressed air.", "outcome": "The printed engine ran on compressed air, turned a small generator and lit an LED. The printed parts came to about 160 g in the slicer, well under the 250 g limit, and the crank radius stayed at 20 mm.\n\nThe real parts didn't match the CAD perfectly, so we fixed problems as they came up: we sanded the piston when it was tight in the bore, reprinted the yoke with higher infill and more clearance after it broke during assembly, and widened the support's pin hole with heat.", "link": "", "facts": [{"v": "40 mm", "l": "Stroke (20 mm crank)"}, {"v": "353 N", "l": "Piston force at 5 bar"}, {"v": "47 W", "l": "Ideal power, 5 bar · 200 rpm"}, {"v": "≈160 g", "l": "Printed mass, limit 250 g"}], "tags": ["SolidWorks", "Motion study", "Engineering calculations", "Scotch yoke", "3D printing", "Bambu Studio", "PLA", "Prototyping"], "viz": {"kind": "engine", "title": "The Scotch yoke, running on our numbers", "speedScale": 0.5, "calc": {"R": 20, "area": 706.9, "vs": 28.3, "pressures": [3, 4, 5], "rpms": [60, 120, 200]}, "mass": {"parts": [{"n": "Cylinder", "g": 90}, {"n": "Crankshaft + pin", "g": 22}, {"n": "Flywheel", "g": 20}, {"n": "Base + rails", "g": 10.5}, {"n": "Piston", "g": 10.4}, {"n": "Yoke", "g": 8.2}, {"n": "Bushings + coupler", "g": 3.8}], "slicer": 160}, "notes": {"sim": "Pick a pressure and speed, or drag the crank angle. The pin turns with the crank and slides along the yoke slot, so the piston moves in simple harmonic motion. Torque peaks at 90° and drops to zero at the dead centres, which is why we added a flywheel. The animation runs at half speed so you can follow it.", "power": "Ideal power from our calculations: average torque times angular speed. Torque depends only on pressure, so each line rises in a straight line with speed.", "mass": "Our first estimate came to about 165 g. The slicer total was about 160 g, comfortably under the 250 g limit. Metal parts and the generator aren't counted in the limit."}}, "images": [{"id": "4ad31396bf9e76f478ef229553305519", "kind": "image", "caption": "The printed engine, assembled"}, {"id": "d733695945bdcfe6b3c8c543fb746265", "kind": "image", "caption": "Full SolidWorks assembly"}, {"id": "b1fded79ab9edecd63e4ef5096b670f9", "kind": "image", "caption": "Transparent cylinder: piston near the top of its stroke"}, {"id": "28bda5b3b8e1465b52835ea48fe0ab05", "kind": "image", "caption": "Transparent cylinder: piston lower in its stroke, used to place the inlet and exhaust"}, {"id": "79d921f2565752218d1314d69b7f5f29", "kind": "image", "caption": "The yoke: the crank pin slides in its slot, replacing the connecting rod"}, {"id": "ba04781e61f0228fafc607ffdf5b8218", "kind": "image", "caption": "Crankshaft with the crank pin and a D-flat for the flywheel"}, {"id": "2d04cc2c21170992b82fbf2776f19add", "kind": "image", "caption": "Flywheel with eight holes to save mass"}, {"id": "3f556cc515017a34748e4f749b89d957", "kind": "image", "caption": "Cylinder with the crank support"}, {"id": "4e81f3e52c35a34e9f9863795826c226", "kind": "image", "caption": "Print preparation in Bambu Studio"}, {"id": "b1eeeced7e88386b397a525beef2c86d", "kind": "image", "caption": "Slicer estimate of filament and print time"}]}, {"id": "maze-robot", "type": "project", "featured": false, "focus": "center 42%", "title": "Maze-Solving Robot", "org": "STEM Lab I · HTU", "role": "Team project · programming", "team": "", "date": "2025", "end": "", "status": "done", "summary": "An autonomous robot that drives through a walled maze using distance sensors and the right-hand rule, built for the STEM Lab I expo competition. I worked on the programming and code.", "problem": "For the STEM expo competition, each team had to build a self-driving robot that finds its way along a maze-like path between parallel walls as fast as possible. It had to stay aligned, avoid hitting the walls and reach the end, with only one run to get it right.", "approach": "Plan: a four-week schedule from planning and buying parts to assembly, coding, calibration and full maze test runs. I worked on the programming and code development.\n\nAlgorithm: we chose the right-hand rule (\"All Right\"). The robot keeps its right side next to the wall: it tries right first, then straight, then left, and turns back at dead ends. It needs no map in advance and won't get lost in loops, so it's a safe choice when there's only one attempt, even though it isn't always the shortest route.\n\nHardware: an Arduino, an L298 dual H-bridge to control each motor's direction and speed with PWM, two N20 gear motors, a caster wheel, a 7.4 V lithium battery, and distance sensors on the front, left and right. We planned IR distance sensors with ultrasonic sensors as the backup, and the final robot used three ultrasonic sensors.", "outcome": "We assembled, wired and programmed the robot, calibrated the sensors and motors, and tested it on full maze runs before the expo competition.", "link": "", "facts": [{"v": "3", "l": "Distance sensors: front, left, right"}, {"v": "2", "l": "Motors with PWM speed control"}, {"v": "4 weeks", "l": "From plan to competition"}, {"v": "1 run", "l": "To get it right at the expo"}], "tags": ["Arduino", "C++", "Robotics", "Right-hand rule", "PWM motor control", "L298 H-bridge", "Ultrasonic sensors", "Prototyping"], "viz": {"kind": "robot", "title": "The right-hand rule in action", "plan": [{"name": "Week 1 · Planning", "icon": "flag", "out": "Defined the goals and requirements, wrote the action plan and timeline, split the roles and listed the parts to buy."}, {"name": "Week 2 · Parts and assembly", "icon": "pencil", "out": "Bought the electronics and mechanical parts, assembled the frame, mounted the sensors, and connected the motors, controller and power."}, {"name": "Week 3 · Coding and integration", "icon": "file", "out": "Wrote and tested the navigation code, calibrated the sensors and motor control, and ran the first movement tests."}, {"name": "Week 4 · Tuning and testing", "icon": "star", "out": "Fine-tuned movement and alignment, ran full maze tests, fixed issues and prepared for the competition."}], "notes": {"maze": "Each step, the robot checks right, front and left (the dotted sensor lines turn pink when a wall is right next to it). It always takes the first open option in that order. Select New maze to try another layout and compare its route with the shortest one.", "plan": "Our four-week plan, from the first meeting to competition day."}}, "images": [{"id": "dae5f221262f6112a2b6fcdf2beb8c99", "kind": "image", "caption": "Our maze robot with its three ultrasonic sensors"}, {"id": "2fe61a174cbc61cf65bc1c3cbd15c93b", "kind": "image", "caption": "Testing sensor readings in the Arduino IDE"}]}, {"id": "innovation-camp-cert", "type": "certificate", "featured": false, "title": "LOYAC Innovation Camp: Certificate of Participation", "org": "LOYAC × Hikma", "role": "", "team": "", "date": "2026-10", "end": "", "status": "done", "summary": "Awarded for taking part in the three-day LOYAC Innovation Camp in the Ajloun Forest Reserve, where my team designed a plan and a website prototype to bring Beit Al-Fann in downtown Amman back to life.", "problem": "", "approach": "", "outcome": "", "link": "", "facts": [], "tags": ["Innovation", "Design thinking", "Teamwork"], "related": "beit-al-fann", "images": [{"id": "d59e765a4be575066fd573491c0467c8", "kind": "image", "caption": "With my certificate at the LOYAC Innovation Camp"}], "focus": "50% 22%"}, {"id": "aiesec-izmit", "type": "volunteering", "featured": false, "title": "Youth 4 Impact: Teaching the SDGs to Kids in İzmit, Türkiye", "org": "AIESEC Global Volunteer · İzmit, Kocaeli, Türkiye", "role": "Global Volunteer · 4 weeks abroad", "team": "", "date": "2026-02", "end": "2026-03", "status": "done", "summary": "Four weeks in İzmit, Türkiye with AIESEC's Youth 4 Impact project, teaching schoolchildren about the UN Sustainable Development Goals through games, workshops and an SDG Day, while living with a Turkish host family.", "problem": "Youth 4 Impact is an AIESEC Global Volunteer project that helps children understand the UN Sustainable Development Goals (SDGs) and find ways to act on them in their own school and community. I joined a partner school in İzmit and ran sessions with the students together with other volunteers.", "approach": "Before the sessions started, we trained on how to work with the project's beneficiaries, met the partner representative to understand the kids' needs, prepared materials for the workshops, and set up how we would measure outcomes.\n\nWith the kids, we started with an introduction and an initial assessment of how much they knew about the SDGs, then made the goals fun through group dynamics and the UN board game \"Go Goals!\". We mapped which goals matter most in their own city, invited local SDG advocates to share their stories, and talked about how kids can help.\n\nThen the kids took the lead. They helped plan and send invitations for an SDG Day at school for parents and neighbours, decorated the school, and worked in groups on their own \"Children's Guide to Save the World\" in drawings, stories and art, which was presented to the school authorities. To close, we collected data from the beneficiaries, analysed the outcomes, and presented a final report to AIESEC members and the partner.", "outcome": "I lived with a Turkish host family for the whole four weeks, which turned the trip into a real cultural exchange, from everyday family life to exploring İzmit and Kocaeli. I came back with practice in teaching, planning events and working in a new language and culture, and with AIESEC's Leadership Development Experience certificate.", "link": "", "facts": [{"v": "4 weeks", "l": "Volunteering abroad"}, {"v": "İzmit", "l": "Kocaeli, Türkiye"}, {"v": "SDG Day", "l": "Run at school with the kids"}, {"v": "Host family", "l": "Lived with a Turkish family"}], "tags": ["UN SDGs", "Teaching & facilitation", "Workshop design", "Event planning", "Impact measurement", "Surveys & interviews", "Cross-cultural communication", "Teamwork"], "images": [{"id": "63e2acb6c4f0ff89d7f4996d759f2a3d", "kind": "image", "caption": "Running a session with the students"}, {"id": "9bfad19eb7313b8dc3da   var rows=[["Open command menu",[MOD,"K"]],["Open command menu","/"],["Switch tabs","1–5"],["Light / dark mode","T"],["Go to contact","C"],["Previous / next project",["←","→"]],["Close anything","Esc"],["This list","?"]];
  if(canEdit)rows.push(["Edit mode","E"]);
  var box=el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":"Keyboard shortcuts"},[
    el("h2",{text:"Keyboard shortcuts"}),
    el("div",{class:"keys"},rows.map(function(r){var ks=[].concat(r[1]);return el("div",{},[el("span",{text:r[0]}),el("span",{},ks.map(function(k){return el("kbd",{text:k});}))]);})),
    el("div",{class:"modal-actions"},[el("button",{class:"btn small",type:"button",onclick:closeLayer,text:"Got it"})])
  ]);
  openLayer(el("div",{},[el("div",{class:"scrim",onclick:closeLayer}),box]));layers[layers.length-1].kind="keys";
}

/* ---------- global keys ---------- */
document.addEventListener("keydown",function(e){
  var tgt=e.target,typing=tgt&&(/INPUT|TEXTAREA|SELECT/.test(tgt.tagName)||tgt.isContentEditable);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return;}
  if(e.key==="Escape"){if(layers.length){e.preventDefault();closeLayer();}return;}
  var top=layers[layers.length-1];
  if(top&&top.kind==="lightbox"){if(e.key==="ArrowRight")top.step(1);if(e.key==="ArrowLeft")top.step(-1);return;}
  if(top&&top.kind==="detail"&&!typing){if(e.key==="ArrowRight"&&top.next)openDetail(top.next);if(e.key==="ArrowLeft"&&top.prev)openDetail(top.prev);return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||layers.length)return;
  var k=e.key;
  if(k==="/"){e.preventDefault();openPalette();}
  else if(k==="?"){e.preventDefault();openKeys();}
  else if(k==="t"||k==="T")toggleTheme();
  else if(k==="c"||k==="C")go("contact");
  else if((k==="e"||k==="E")&&canEdit)setEditing(!editing);
  else if(/^[1-5]$/.test(k)){var v=visibleTypes()[+k-1];if(v)selectTab(v.key,true);}
});

/* ---------- theme ---------- */
function isDark(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a)return a==="dark";
  return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
}
function toggleTheme(){
  var next=isDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("portfolio-theme",next);}catch(e){}
  render();toast(next==="dark"?"Dark mode":"Light mode");
}
try{var th=localStorage.getItem("portfolio-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}

/* ---------- motion: rotator, counters, scroll ---------- */
var rotTimer;
function startRotator(){
  clearInterval(rotTimer);var tr=state.profile.traits||[];if(tr.length<2||reduce)return;var i=0;
  rotTimer=setInterval(function(){var b=document.getElementById("rot");if(!b)return;b.classList.add("out");setTimeout(function(){i=(i+1)%tr.length;b.textContent=tr[i];b.classList.remove("out");},350);},2600);
}
var io;
function observe(){
  if(io)io.disconnect();
  if(!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;var n=e.target;io.unobserve(n);
    if(reduce)return;var to=+n.getAttribute("data-count"),t0=performance.now();
    (function step(t){var k=Math.min(1,(t-t0)/900);n.textContent=String(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(step);})(t0);
  });},{threshold:.6});
  document.querySelectorAll("[data-count]").forEach(function(n){io.observe(n);});
}
var secIds=["about","skills","work","credentials","journey","contact"];
function onScroll(){
  var h=document.documentElement.scrollHeight-innerHeight,y=window.scrollY;
  var pr=document.getElementById("progress");if(pr)pr.style.transform="scaleX("+(h>0?y/h:0)+")";
  var f=document.getElementById("fab");if(f)f.setAttribute("data-show",y>700?"true":"false");
  var cur=null;secIds.forEach(function(id){var n=document.getElementById(id);if(n&&n.getBoundingClientRect().top<innerHeight*.4)cur=id;});
  document.querySelectorAll(".dock a.nav").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-sec")===cur);});
}
window.addEventListener("scroll",onScroll,{passive:true});

/* ---------- edit bar + publish ---------- */
function setEditing(v){editing=v;render();toast(v?"Edit mode on":"Edit mode off");}
function editBar(){
  var d=dirty();
  return el("div",{class:"editbar"},[el("div",{class:"wrap"},[
    el("span",{class:"msg",text:d?"You have unpublished changes. Visitors see the old version until you publish.":"Edit mode. Select Edit on anything, or use Add. Then publish."}),
    el("button",{class:"btn",type:"button",onclick:editProfile},[icon("user"),"Profile & contact"]),
    d?el("button",{class:"btn",type:"button",onclick:function(){state=normalize(JSON.parse(JSON.stringify(saved)));persistDraft();render();toast("Changes discarded");},text:"Discard"}):null,
    el("button",{class:"btn gold",type:"button",disabled:!d||null,onclick:publish,text:"Publish changes"})
  ])]);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function buildDoc(st){
  var head=document.head.querySelector("style"),reset=head?head.textContent:"";
  var json=JSON.stringify(st).replace(/</g,"\\u003c");
  var lk=Array.prototype.map.call(document.querySelectorAll("body link[rel]"),function(l){return l.outerHTML;}).join("\n");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(st.profile.first+" "+st.profile.last)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+lk+'\n<style>'+SRC_STYLE+'</style>\n\n<div id="app"></div>\n\n'+
    '<script type="application/json" id="portfolio-state">'+json+'<\/script>\n\n<script id="portfolio-app">'+SRC_APP+'<\/script>\n</body></html>';
}
function publish(){
  if(!artifactNs){toast("Saving isn't available in this view.");return;}
  var now=new Date();state.updated=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  toast("Publishing…");
  artifactNs.publish(buildDoc(state)).then(function(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}toast("Published");burst(innerWidth/2,innerHeight-60);})
  .catch(function(e){var c=e&&e.code;
    if(c==="conflict")toast("A newer version was saved elsewhere. The page will reload to it.");
    else if(c==="not_granted"||c==="not_writer")toast("You don't have permission to publish this page.");
    else toast("Couldn't publish: "+((e&&e.message)||"try again"));});
}

/* ---------- forms ---------- */
function modal(title,form,onSave){
  var err=el("div",{class:"err",role:"alert"});
  var f=el("form",{class:"form",onsubmit:function(e){e.preventDefault();var m=onSave();if(m){err.textContent=m;return;}closeLayer();persistDraft();var reopen=layers.length&&layers[layers.length-1].kind==="detail";var id=(location.hash||"").slice(1);if(reopen)closeLayer();render();if(reopen&&state.items.some(function(x){return x.id===id;}))openDetail(id);toast("Saved to draft. Publish when you're ready.");}},form.concat([
    el("div",{class:"full"},[err]),
    el("div",{class:"full modal-actions"},[el("button",{type:"button",class:"btn ghost",onclick:closeLayer,text:"Cancel"}),el("button",{type:"submit",class:"btn primary",text:"Save"})])
  ]));
  var box=el("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title},[el("h2",{text:title}),f]);
  openLayer(el("div",{},[el("div",{class:"scrim"}),box]));layers[layers.length-1].kind="modal";
  var first=f.querySelector("input,select,textarea");if(first)first.focus();
}
function field(id,label,value,opts){
  opts=opts||{};var input;
  if(opts.type==="textarea")input=el("textarea",{id:id,name:id,placeholder:opts.placeholder||null});
  else if(opts.type==="select")input=el("select",{id:id,name:id},opts.options.map(function(o){return el("option",{value:o[0],text:o[1]});}));
  else input=el("input",{id:id,name:id,type:opts.type||"text",placeholder:opts.placeholder||null,required:opts.required||null});
  input.value=value||"";
  return el("label",{class:opts.full?"full":null},[label,opts.hint?el("span",{class:"hint",text:opts.hint}):null,input]);
}
function divider(t){return el("div",{class:"divider",text:t});}
function val(id){var n=document.getElementById(id);return n?n.value.trim():"";}
function csv(id){return val(id).split(",").map(function(s){return s.trim();}).filter(Boolean);}

function multiUploader(list,accept,opts){
  opts=opts||{};var box=el("div",{class:"upload"});
  function paint(){
    box.textContent="";
    list.forEach(function(f,k){
      box.appendChild(el("div",{class:"th"},[
        f.kind==="image"?el("img",{src:blob(f.id),alt:""}):el("div",{class:"pdf",text:f.kind==="video"?"Video":"PDF"}),
        k===0&&f.kind==="image"&&opts.coverLabel?el("span",{class:"cv",text:"Cover"}):null,
        el("button",{type:"button","aria-label":"Remove file",onclick:function(){list.splice(k,1);paint();}},[icon("x")]),
        opts.captions?el("input",{type:"text",placeholder:"Caption",value:f.caption||"","aria-label":"Caption for file "+(k+1),style:"margin-top:6px;width:150px;font-size:12px;padding:5px 8px",oninput:function(e){f.caption=e.target.value;}}):null
      ]));
    });
    if(!assets){box.appendChild(el("span",{class:"hint",text:"File uploads aren't available in this view."}));return;}
    if(opts.max&&list.length>=opts.max)return;
    var status=el("span",{class:"hint",text:opts.help||""});
    var inp=el("input",{type:"file",accept:accept,multiple:opts.max===1?null:true,style:"display:none",onchange:function(){
      var files=Array.prototype.slice.call(inp.files||[]);if(!files.length)return;
      if(opts.max)files=files.slice(0,opts.max-list.length);
      var done=0;status.textContent="Uploading "+files.length+"…";
      files.reduce(function(pr,file){return pr.then(function(){
        var t=file.type;if(!t&&/\.pdf$/i.test(file.name))t="application/pdf";
        return assets.upload(file,t?{type:t}:undefined).then(function(r){list.push({id:r.id,kind:/pdf/.test(r.contentType)?"pdf":/video/.test(r.contentType)?"video":"image"});done++;})
        .catch(function(e){var c=e&&e.code;status.textContent=c==="too_large"?file.name+" is over 20 MB.":c==="unsupported_type"?file.name+": use PNG, JPG, WebP or PDF.":"Upload of "+file.name+" failed.";});
      });},Promise.resolve()).then(function(){if(done)paint();});
    }});
    box.appendChild(inp);
    box.appendChild(el("button",{type:"button",class:"btn small",onclick:function(){inp.click();}},[icon("plus"),opts.button||"Add files"]));
    box.appendChild(status);
  }
  paint();return box;
}

function editItem(it,type){
  var isNew=!it;
  var draft=it?JSON.parse(JSON.stringify(it)):{id:"i"+Date.now().toString(36),type:type,title:"",org:"",role:"",team:"",date:"",end:"",status:"done",summary:"",problem:"",approach:"",outcome:"",link:"",tags:[],facts:[],images:[]};
  var t=typeOf(draft.type);
  var orgLabel={project:"Course or organization",certificate:"Issued by",course:"Provider",volunteering:"Organization",conference:"Organizer or venue"}[draft.type];
  var story=draft.type==="project"||draft.type==="volunteering";
  modal((isNew?"Add ":"Edit ")+t.one,[
    field("f-type","Tab",draft.type,{type:"select",options:TYPES.map(function(x){return [x.key,x.label];})}),
    field("f-status","Status",draft.status,{type:"select",options:[["done","Completed"],["progress","In progress"]]}),
    field("f-title","Title",draft.title,{full:true,required:true}),
    field("f-org",orgLabel,draft.org),
    field("f-role","Your role",draft.role,{placeholder:"Team lead, Volunteer, Speaker…"}),
    field("f-team","Team & supervisors",draft.team,{full:true,placeholder:"Optional"}),
    field("f-date","Start or issue date",draft.date,{placeholder:"2026-06 or 2026",hint:"Year, or year-month"}),
    field("f-end","End date",draft.end,{placeholder:"present, 2026-09, or blank",hint:"Optional"}),
    field("f-summary","Short summary",draft.summary,{type:"textarea",full:true,hint:"One or two sentences. Shown on the card and as the intro."}),
    field("f-facts","Key numbers",(draft.facts||[]).map(function(f){return f.v+" | "+f.l;}).join("\n"),{type:"textarea",full:true,hint:"One per line, as value | label. Example: 5 m | Telescopic reach"}),
    field("f-featured","Feature on top",draft.featured?"yes":"no",{type:"select",options:[["no","No"],["yes","Yes, show it first and larger"]]}),
    divider(story?"The story (each part is optional)":"More detail (optional)"),
    field("f-problem",story?"The challenge":"Background",draft.problem,{type:"textarea",full:true}),
    field("f-approach",story?"My approach":"What I learned or did",draft.approach,{type:"textarea",full:true}),
    field("f-outcome","Outcome",draft.outcome,{type:"textarea",full:true,hint:"Results, numbers, feedback"}),
    divider("Media & links"),
    el("div",{class:"full"},[el("label",{},["Photos, videos, certificate scans or PDFs",el("span",{class:"hint",text:"The first photo becomes the cover. Several photos make a gallery."})]),multiUploader(draft.images,"image/png,image/jpeg,image/webp,image/gif,application/pdf,video/mp4,video/webm",{coverLabel:true,captions:true,button:"Add photos or PDF"})]),
    field("f-link","Link",draft.link,{type:"url",placeholder:"https://…",full:true,hint:"Credential URL, report, video, drive folder…"}),
    field("f-tags","Tags",(draft.tags||[]).join(", "),{full:true,hint:"Comma separated. They become filters."})
  ],function(){
    draft.type=val("f-type");draft.status=val("f-status");draft.title=val("f-title");draft.org=val("f-org");draft.role=val("f-role");
    draft.date=val("f-date");draft.end=val("f-end").toLowerCase()==="present"?"present":val("f-end");
    draft.summary=val("f-summary");draft.problem=val("f-problem");draft.approach=val("f-approach");draft.outcome=val("f-outcome");
    draft.link=val("f-link");draft.tags=csv("f-tags");draft.team=val("f-team");draft.featured=val("f-featured")==="yes";
    draft.facts=val("f-facts").split("\n").map(function(l){var i=l.indexOf("|");return i>0?{v:l.slice(0,i).trim(),l:l.slice(i+1).trim()}:null;}).filter(function(f){return f&&f.v;});
    if(draft.featured)state.items.forEach(function(x){if(x.id!==draft.id&&x.type===draft.type)x.featured=false;});
    if(!draft.title)return "Add a title.";
    if(draft.link&&!/^https?:\/\//i.test(draft.link))return "Links need to start with https://";
    if(isNew)state.items.push(draft);else state.items=state.items.map(function(x){return x.id===draft.id?draft:x;});
    gs[groupOf(draft.type)].tab=draft.type;
  });
  var sel=document.getElementById("f-type");
  sel.addEventListener("change",function(){if(isNew)draft.type=sel.value;});
}

function skillsOf(p,k){var g=(p.skillGroups||[]).filter(function(x){return x.key===k;})[0];return g?(g.items||[]).join(", "):"";}
function editProfile(){
  var p=JSON.parse(JSON.stringify(state.profile));
  var photo=p.photo?[{id:p.photo,kind:"image"}]:[],cv=p.cv?[{id:p.cv,kind:"pdf"}]:[];
  modal("Profile & contact",[

    el("div",{class:"full"},[el("label",{},["Profile photo"]),multiUploader(photo,"image/png,image/jpeg,image/webp",{max:1,button:"Upload photo"})]),
    el("div",{class:"full"},[el("label",{},["CV (PDF)"]),multiUploader(cv,"application/pdf",{max:1,button:"Upload CV"})])

    p.education={school:val("p-school"),degree:val("p-degree"),years:val("p-years"),place:(p.education||{}).place||p.location||""};
    p.email=val("p-email");p.email2=val("p-email2");p.phone=val("p-phone");p.linkedin=val("p-linkedin");p.location=val("p-location");
    p.photo=photo[0]?photo[0].id:null;p.cv=cv[0]?cv[0].id:null;

    if(p.linkedin&&!/^https?:\/\//i.test(p.linkedin))return "The LinkedIn link needs to start with https://";

/* ---------- small UI ---------- */
var toastTimer;
function toast(m){
  var t=document.querySelector(".toast");if(t)t.remove();
  t=el("div",{class:"toast",role:"status"},[flower(null,{petals:12}),m]);document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove();},2800);
}
function copy(text,msg){
  function fallback(){toast(text);}
  try{navigator.clipboard.writeText(text).then(function(){toast(msg||"Copied");},fallback);}catch(e){fallback();}
}

/* ---------- boot ---------- */
render();
(function(){
  var h=(location.hash||"").slice(1);
  if(!h)return;
  if(state.items.some(function(x){return x.id===h;}))openDetail(h);
  else if(TYPES.some(function(t){return t.key===h;}))selectTab(h,true);
})();

if(window.claude&&window.claude.use){
  window.claude.use("user").then(function(u){return u?u.canEdit():false;}).then(function(ok){
    canEdit=!!ok;if(!canEdit)return;
    return Promise.all([window.claude.use("artifact"),window.claude.use("assets")]).then(function(r){
      artifactNs=r[0];assets=r[1];if(!artifactNs)canEdit=false;
      if(canEdit&&dirty())editing=true;
      if(!layers.length)render();
    });
  }).catch(function(){});
}
})();
